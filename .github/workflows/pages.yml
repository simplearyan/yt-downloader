name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Refresh the committed release snapshot using the repo-scoped token
      # (no API rate limit), so the offline fallback is always current.
      - name: Fetch latest releases snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/simplearyan/yt-downloader/releases?per_page=20" \
            -o site/releases.json

      # Also inline the same data into index.html so the version cards render
      # on first paint (no async fetch flicker on refresh).
      - name: Inline release snapshot into index.html
        run: |
          python3 - <<'PY'
          import json, re
          data = json.load(open('site/releases.json', encoding='utf-8'))
          out = [{
              'tag_name': r.get('tag_name'),
              'name': r.get('name'),
              'prerelease': r.get('prerelease'),
              'published_at': r.get('published_at'),
              'assets': [{'name': a.get('name'), 'browser_download_url': a.get('browser_download_url')} for a in r.get('assets', [])]
          } for r in data]
          s = json.dumps(out, separators=(',', ':'))
          html = open('site/index.html', encoding='utf-8').read()
          pat = re.compile(r'<script id="releases-data" type="application/json">.*?</script>', re.S)
          html = pat.sub('<script id="releases-data" type="application/json">' + s + '</script>', html)
          open('site/index.html', 'w', encoding='utf-8').write(html)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
