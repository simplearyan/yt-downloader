name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Git ref to build - tag (vX.Y.Z), branch, or commit SHA.
          Leave empty to build the latest commit on the default branch.
        required: false
        type: string
        default: ""
      create_release:
        description: "Create / update a GitHub Release and attach the installer"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write # OIDC token for Azure Artifact Signing (unused when signing secrets are absent)

jobs:
  build-windows:
    name: Windows installer (NSIS + MSI)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # manual ref → that ref; tag push → the tag; else default branch (latest commit)
          ref: ${{ (inputs.ref != '' && inputs.ref) || (github.event_name == 'push' && github.ref) || '' }}

      - name: Resolve ref name and release info
        id: meta
        shell: bash
        run: |
          REF_NAME="${{ (inputs.ref != '' && inputs.ref) || (github.event_name == 'push' && github.ref_name) || '' }}"
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            # a real version tag (vX.Y.Z or vX.Y.Z-alpha)
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=$REF_NAME" >> "$GITHUB_OUTPUT"
            if [[ "$REF_NAME" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            # manual build of latest commit / branch / SHA -> nightly-style release
            echo "tag=build-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
            echo "name=Nightly build ${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "ref_name=$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Sync version from tag
        shell: bash
        run: |
          REF_NAME="${{ steps.meta.outputs.ref_name }}"
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VER="${REF_NAME#v}"
            VER="${VER%%-*}"
            # NOTE: the heredoc delimiter (PY) must be flush-left after YAML
            # block-scalar stripping, or bash never finds the terminator.
            python - "$VER" <<'PY'
          import json, re, sys
          ver = sys.argv[1]
          with open('src-tauri/tauri.conf.json', 'r', encoding='utf-8') as f:
              conf = json.load(f)
          conf['version'] = ver
          with open('src-tauri/tauri.conf.json', 'w', encoding='utf-8') as f:
              json.dump(conf, f, indent=2, ensure_ascii=False)
              f.write('\n')
          with open('src-tauri/Cargo.toml', 'r', encoding='utf-8') as f:
              cargo = f.read()
          cargo = re.sub(r'^version\s*=\s*"[^"]*"', f'version = "{ver}"', cargo, count=1, flags=re.M)
          with open('src-tauri/Cargo.toml', 'w', encoding='utf-8') as f:
              f.write(cargo)
          PY
            echo "Synced version -> $VER"
          else
            echo "No version tag - keeping existing version"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build installer (tauri)
        run: npm run tauri:build

      # Code signing is fully optional: the steps below run only when the
      # Azure Artifact Signing secrets exist. Without them, the build stays
      # unsigned (SmartScreen will warn) exactly as before.
      - name: Azure login (code signing)
        # secrets aren't allowed in if:, so map them to env vars and gate on those
        if: ${{ env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign installers with Azure Artifact Signing
        if: ${{ env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.AZURE_SIGNING_ENDPOINT != '' && env.AZURE_SIGNING_ACCOUNT != '' && env.AZURE_CERT_PROFILE != '' }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\src-tauri\target\release\bundle
          files-folder-recurse: true
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-workload-identity-credential: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Attach to GitHub Release
        if: github.event_name == 'push' || inputs.create_release == true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: |
            Windows installer built automatically from **${{ steps.meta.outputs.ref_name || github.sha }}**.

            - `*.exe` — NSIS installer (double-click to install)
            - `*.msi` — MSI package (silent: `msiexec /i <file>.msi`)

            > ${{ secrets.AZURE_CLIENT_ID != '' && 'Code-signed with Azure Artifact Signing.' || 'Unsigned build: Windows SmartScreen may warn — click *More info → Run anyway*.' }}
            > Requires WebView2 (preinstalled on Windows 10/11).
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          prerelease: ${{ steps.meta.outputs.prerelease }}
          overwrite_files: true
          fail_on_unmatched_files: false

      # After a release is published, refresh the download-site snapshot and
      # push it so the site (pages.yml) shows the new version without any
      # runtime API calls. Only runs for tag pushes.
      - name: Refresh download-site releases snapshot
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/simplearyan/yt-downloader/releases?per_page=20" \
            -o site/releases.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/releases.json
          if git diff --cached --quiet; then
            echo "Snapshot already up to date"
          else
            git commit -m "chore: refresh download-site releases snapshot"
            git push origin HEAD:main
          fi
