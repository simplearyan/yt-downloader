<!DOCTYPE html>
<html lang="en" data-theme="dark">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'));</script>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Downloader</title>

  <!-- Local system font stack (offline-safe) + inline Lucide icon sprite -->

  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true"><symbol id="lucide-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"></path><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path></symbol><symbol id="lucide-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></symbol><symbol id="lucide-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path></symbol><symbol id="lucide-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></symbol><symbol id="lucide-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></symbol><symbol id="lucide-refresh-cw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></symbol><symbol id="lucide-trash-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></symbol><symbol id="lucide-circle-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></symbol><symbol id="lucide-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></symbol><symbol id="lucide-file-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M12 18v-6"></path><path d="m9 15 3 3 3-3"></path></symbol><symbol id="lucide-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></symbol><symbol id="lucide-zap-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.768 5.111 13.44 2.44a1.5 1.5 0 0 1 2.474 1.561l-1.633 4.625"></path><path d="m18.889 13.232.672-.672A1.5 1.5 0 0 0 18.5 10h-2.844"></path><path d="m2 2 20 20"></path><path d="m7.94 7.94-3.5 3.499A1.5 1.5 0 0 0 5.5 14h4.002a.5.5 0 0 1 .471.666L8.086 20a1.5 1.5 0 0 0 2.475 1.56l5.5-5.5"></path></symbol><symbol id="lucide-circle-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></symbol><symbol id="lucide-github" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></symbol><symbol id="lucide-cloud-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.6 19.06a5.5 5.5 0 0 1-4.16-9.1 7 7 0 0 1 12.84 2.93"></path><path d="M4.393 15.269A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.436 8.284"></path><path d="M12 13v8"></path><path d="m8 17 4-4 4 4"></path></symbol><symbol id="lucide-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></symbol><symbol id="lucide-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></symbol></svg>

  <div id="app">
    <!-- Top App Bar -->
    <header class="app-bar">
      <div class="app-bar-content">
        <div class="app-bar-start">
          <svg class="lucide  app-icon" aria-hidden="true"><use href="#lucide-download"></use></svg>
          <div class="app-bar-titles">
            <h1 class="app-title">Downloader</h1>
            <span class="app-subtitle">YouTube</span>
          </div>
        </div>
        <div class="app-bar-end">
          <a class="icon-btn" href="https://github.com/simplearyan/yt-downloader" target="_blank" rel="noopener" aria-label="GitHub repository" title="GitHub repo">
            <svg class="lucide" aria-hidden="true"><use href="#lucide-github"></use></svg>
          </a>
          <button id="updateBtn" class="icon-btn" aria-label="Check for updates" title="Check for updates">
            <svg class="lucide" aria-hidden="true"><use href="#lucide-cloud-download"></use></svg>
          </button>
          <button id="autoDownloadToggle" class="icon-btn" aria-label="Toggle auto-download" title="Auto-download is OFF">
            <svg class="lucide" aria-hidden="true"><use href="#lucide-zap-off"></use></svg>
          </button>
          <button id="themeToggle" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">
            <svg class="lucide icon-sun" aria-hidden="true"><use href="#lucide-sun"></use></svg>
            <svg class="lucide icon-moon" aria-hidden="true"><use href="#lucide-moon"></use></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="container">
        <!-- URL Input Card -->
        <div class="url-card" id="urlCard">
          <div class="input-wrapper input-wrapper-with-dropdown">
            <svg class="lucide input-icon" aria-hidden="true"><use href="#lucide-search"></use></svg>
            <input
              type="url"
              id="urlInput"
              class="input"
              placeholder="Paste a YouTube URL"
              autocomplete="off"
              spellcheck="false"
            />
            <button id="fetchBtn" class="btn btn-primary">
              <svg class="lucide btn-search-icon" aria-hidden="true"><use href="#lucide-search"></use></svg>
              <span class="btn-label">Search</span>
            </button>
            <div class="search-history" id="searchHistory"></div>
          </div>
        </div>

        <!-- Loading State -->
        <section class="card loading-card" id="loadingCard" style="display:none">
          <div class="card-content" style="text-align:center;padding:48px 24px">
            <div class="spinner"></div>
            <p class="loading-text">Fetching video information</p>
          </div>
        </section>

        <!-- Video Info Card (stays visible during download) -->
        <section class="card video-card" id="videoCard" style="display:none">
          <div class="video-card-layout">
            <div class="thumbnail-wrapper">
              <img id="thumbnail" class="thumbnail" alt="Video thumbnail" />
              <span class="duration-badge" id="durationBadge">0:00</span>
            </div>
            <div class="video-info">
              <h2 class="video-title" id="videoTitle"></h2>
              <p class="video-uploader" id="videoUploader"></p>
              <p class="video-meta" id="videoMeta"></p>
            </div>
          </div>
        </section>

        <!-- Progress Card (inline, below video info) -->
        <section class="card progress-card" id="progressCard" style="display:none">
          <div class="card-content">
            <div class="progress-header">
              <span class="progress-title" id="progressTitle">Downloading</span>
              <span class="progress-status" id="progressStatus">0%</span>
            </div>
            <div class="progress-track">
              <div class="progress-bar" id="progressBar" style="width:0%"></div>
            </div>
            <div class="progress-details">
              <span id="progressSpeed">&mdash;</span>
              <span id="progressEta">&mdash;</span>
              <span id="progressSize">&mdash;</span>
            </div>
            <div class="progress-actions">
              <button class="btn btn-primary" id="downloadBtn" style="display:none">
                <svg class="lucide" aria-hidden="true"><use href="#lucide-download"></use></svg>
                <span class="btn-label">Save File</span>
              </button>
              <button class="btn btn-secondary" id="newDownloadBtn" style="display:none">
                <svg class="lucide" aria-hidden="true"><use href="#lucide-refresh-cw"></use></svg>
                <span class="btn-label">New Download</span>
              </button>
            </div>
          </div>
        </section>

        <!-- Format Selection Card -->          <section class="card format-card" id="formatCard" style="display:none">
          <div class="format-tabs" id="formatTabs">
            <button class="format-tab active" data-tab="recommended">Recommended</button>
            <button class="format-tab" data-tab="video">Video</button>
            <button class="format-tab" data-tab="audio">Audio</button>
            <button class="format-tab" data-tab="thumbnail">Thumbnail</button>
          </div>
          <div class="codec-sub-tabs" id="codecSubTabs" style="display:none"></div>
          <div class="card-content format-options" id="formatOptions">
            <!-- Dynamically populated -->
          </div>
        </section>

        <!-- History Card -->
        <section class="card history-card" id="historyCard" style="display:none">
          <div class="card-header">
            <div class="history-header">
              <h3 class="card-title">History</h3>
              <button id="clearHistoryBtn" class="btn btn-text" title="Clear history">
                <svg class="lucide" aria-hidden="true"><use href="#lucide-trash-2"></use></svg>
              </button>
            </div>
          </div>
          <div class="card-content history-items" id="historyItems">
            <!-- Dynamically populated -->
          </div>
        </section>

        <!-- Error Card -->
        <section class="card error-card" id="errorCard" style="display:none">
          <div class="card-content">
            <div class="error-content">
              <svg class="lucide  error-icon" aria-hidden="true"><use href="#lucide-circle-alert"></use></svg>
              <div>
                <p class="error-title">Something went wrong</p>
                <p class="error-message" id="errorMessage"></p>
              </div>
            </div>
            <button id="retryBtn" class="btn btn-secondary">
              <svg class="lucide" aria-hidden="true"><use href="#lucide-refresh-cw"></use></svg>
              <span class="btn-label">Try Again</span>
            </button>
          </div>
        </section>
      </div>
    </main>

    <!-- Update Modal -->
    <div class="modal-overlay" id="updateModal" style="display:none">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="updateModalTitle">
        <div class="modal-header">
          <h3 id="updateModalTitle">Check for Updates</h3>
          <button class="modal-close" id="updateModalClose" aria-label="Close">
            <svg class="lucide" aria-hidden="true"><use href="#lucide-x"></use></svg>
          </button>
        </div>
        <div class="modal-body" id="updateModalBody"></div>
        <div class="modal-footer" id="updateModalFooter" style="display:none">
          <button class="btn btn-secondary" id="updateNotNowBtn">Not now</button>
          <a class="btn btn-primary" id="updateDownloadBtn" href="#" target="_blank" rel="noopener" style="display:none">Download update</a>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>
        Built by
        <a href="https://github.com/simplearyan" target="_blank" rel="noopener">simplearyan</a>
        &middot; Powered by
        <a href="https://github.com/yt-dlp/yt-dlp" target="_blank" rel="noopener">yt-dlp</a>
      </p>
      <p class="footer-repo">
        <svg class="lucide" aria-hidden="true"><use href="#lucide-github"></use></svg>
        <a href="https://github.com/simplearyan/yt-downloader" target="_blank" rel="noopener">simplearyan/yt-downloader</a>
      </p>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
